[package]
name = "lau-optimal-transport-agents"
version = "0.1.0"
edition = "2021"
description = "Optimal transport theory applied to agent belief distributions — Wasserstein distances, Sinkhorn, barycenters, gradient flows"
license = "MIT"

[dependencies]
nalgebra = { version = "0.33", features = ["serde-serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
approx = "0.5"
